name: Screenshots
# Renders the Compose screenshot tests (the ones that skip themselves without -Pscreenshots) and attaches the PNGs, so a design can be
# looked at before it is released. Run it by hand on any branch; it changes nothing in the repository.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Test class filter, e.g. app.ultimate.shots.* or app.ultimate.shots.ActivityShotsTest'
        required: false
        default: 'app.ultimate.shots.*'
permissions:
  contents: read
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch the local AI engine (Cactus Needle, Apache-2.0)
        run: ./scripts/fetch-models.sh
      - name: Render the screenshots
        run: gradle --no-daemon :app:testUltimateplusDebugUnitTest -Pscreenshots --tests "${{ inputs.tests }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots
          path: docs/screenshots/
          if-no-files-found: warn

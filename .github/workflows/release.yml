name: Release APKs
# Builds every edition, signs them with the permanent Ultimate key and publishes them as GitHub Release assets.
# APKs are release assets only; they never enter Git history. The tag is taken from versionName in app/build.gradle.kts.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Read the version
        id: v
        run: |
          name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          code=$(sed -n 's/.*COMPANION_VERSION_CODE")?.toIntOrNull() ?: \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          test -n "$name" && test -n "$code" || { echo 'Could not read versionName and versionCode'; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "code=$code" >> "$GITHUB_OUTPUT"; echo "tag=v$name" >> "$GITHUB_OUTPUT"
      - name: Refuse to publish an older build or replace a released version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          existing=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' | grep -E '^v[0-9]' || true)
          if [ -n "$existing" ]; then
            newest=$(printf '%s\n%s\n' "$existing" "$TAG" | sort -V | tail -1)
            if [ "$newest" != "$TAG" ]; then echo "A newer release ($newest) already exists; refusing to publish the older $TAG."; exit 1; fi
          fi
          # A version that is already released may only be re-published from the very same commit (to fix its notes or
          # re-attach assets). Different source means a new version number: bump versionName and versionCode.
          released=$(git ls-remote --tags origin "refs/tags/$TAG^{}" "refs/tags/$TAG" | awk 'END{print $1}')
          if [ -n "$released" ] && [ "$released" != "$GITHUB_SHA" ]; then
            echo "$TAG was already released from commit $released, not $GITHUB_SHA. Bump the version instead of replacing it."; exit 1
          fi
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ULTIMATE_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ULTIMATE_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD" || { echo 'Add the ULTIMATE_KEYSTORE_BASE64 and ULTIMATE_KEYSTORE_PASSWORD repository secrets first (see README, "Publishing a release").'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ultimate.jks"
      - name: Fetch the local AI engine (Cactus Needle, Apache-2.0)
        run: ./scripts/fetch-models.sh
      - name: Test and build every edition
        env:
          ULTIMATE_KEYSTORE_FILE: ${{ runner.temp }}/ultimate.jks
          ULTIMATE_KEYSTORE_PASSWORD: ${{ secrets.ULTIMATE_KEYSTORE_PASSWORD }}
          ULTIMATE_KEY_ALIAS: ultimate
          ULTIMATE_KEY_PASSWORD: ${{ secrets.ULTIMATE_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:testUltimateplusDebugUnitTest :app:testUltimateDebugUnitTest :app:testSqueezeDebugUnitTest :app:assembleRelease :wear:testReleaseUnitTest :wear:assembleRelease
      - name: Verify what was built (version, signer, models, AI engine)
        env:
          # The permanent Ultimate signing certificate (public). A different key would build fine but phones would refuse
          # to update, so any other certificate stops the release. Change it only for a deliberate key rotation.
          EXPECTED_CERT: d2143ab20357ef4678fe3e4f87197860b3e6121fc1342591993bf7b8086bfd7d
          NAME: ${{ steps.v.outputs.name }}
          CODE: ${{ steps.v.outputs.code }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          fail=0
          cert_of() { "$tools/apksigner" verify --print-certs "$1" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f'; }
          for apk in app/build/outputs/apk/*/release/*.apk wear/build/outputs/apk/release/wear-release.apk; do
            [ "$(cert_of "$apk")" = "$EXPECTED_CERT" ] || { echo "WRONG SIGNER: $apk"; fail=1; }
          done
          for flavor in ultimateplus ultimate studio squeeze audio pluck traffic; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            badge=$("$tools/aapt2" dump badging "$apk" | head -1)
            echo "$badge" | grep -q "versionName='$NAME'" && echo "$badge" | grep -q "versionCode='$CODE'" || { echo "VERSION MISMATCH in $apk: $badge"; fail=1; }
          done
          # The two full editions carry the hand/face models and the Local AI engine. The build quietly produces a working
          # app without them (the engine falls back to a stub), so check the finished files rather than trusting the build.
          for flavor in ultimateplus ultimate; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            for need in assets/gesture_recognizer.task assets/face_landmarker.task assets/hand_landmarker.task; do
              unzip -l "$apk" | grep -q "$need" || { echo "MISSING $need in $apk"; fail=1; }
            done
            size=$(unzip -l "$apk" | awk '/lib\/arm64-v8a\/libultimate_needle.so/ {print $1}')
            [ "${size:-0}" -gt 500000 ] || { echo "Local AI engine missing (stub library, ${size:-0} bytes) in $apk"; fail=1; }
          done
          # The offline edition must have no internet permission; the networked one must.
          "$tools/aapt2" dump permissions app/build/outputs/apk/ultimate/release/app-ultimate-release.apk | grep -q 'android.permission.INTERNET' && { echo "Ultimate (offline) declares INTERNET"; fail=1; }
          exit $fail
      - name: Name the files and write checksums
        id: pack
        run: |
          mkdir -p dist-apk
          v='${{ steps.v.outputs.name }}'
          for pair in ultimateplus:Ultimate-Plus ultimate:Ultimate studio:Studio squeeze:Squeeze audio:Video-to-Audio pluck:Pluck traffic:Traffic-Inspector; do
            flavor=${pair%%:*}; name=${pair##*:}
            cp "app/build/outputs/apk/$flavor/release/app-$flavor-release.apk" "dist-apk/$name-$v.apk"
          done
          # Ultimate+ for the watch: same package and key as Ultimate-Plus, installed on the watch itself.
          cp wear/build/outputs/apk/release/wear-release.apk "dist-apk/Ultimate-Plus-Watch-$v.apk"
          (cd dist-apk && sha256sum *.apk > SHA256SUMS.txt)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cert=$("$tools/apksigner" verify --print-certs "dist-apk/Ultimate-Plus-$v.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          test -n "$cert" || { echo 'APK is not signed'; exit 1; }
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Ultimate-${{ steps.v.outputs.name }}
          path: dist-apk/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VER: ${{ steps.v.outputs.name }}
          CERT: ${{ steps.pack.outputs.cert }}
          PRE: ${{ inputs.prerelease }}
        run: |
          python3 - <<'PY' > notes.md
          import os, re
          ver, cert = os.environ["VER"], os.environ["CERT"]
          src = open("app/src/main/java/app/ultimate/home/AboutInfo.kt").read()
          # The entry runs from its Entry("<version>" to the next Entry( (entries span many lines); its notes are the
          # quoted strings before any "tries =" list.
          start = src.find('Entry("' + ver + '"')
          block = src[start:src.find("Entry(", start + 6)] if start >= 0 else ""
          block = block.split("tries =")[0][len('Entry("' + ver + '"'):]
          notes = [n.replace('\\"', '"') for n in re.findall(r'"((?:[^"\\]|\\.)*)"', block)]
          print("## What's new in " + ver)
          print("\n".join("- " + n for n in notes) if notes else "- See the commit history.")
          print("""
          ## Which file do I want?
          - **Ultimate-Plus**: everything, including the SSH client and server, sending files to your computer and network tools. Needs internet permission.
          - **Ultimate**: the same tools without any internet permission. It cannot send anything anywhere.
          - **Studio, Squeeze, Video-to-Audio, Pluck, Traffic-Inspector**: single-purpose apps.
          - **Ultimate-Plus-Watch**: for a Wear OS watch (such as a Galaxy Watch), alongside Ultimate-Plus on the phone. Install it on the watch; Ultimate+ → Watch on the phone shows how.

          ## Install
          Download an APK on your phone, open it and allow installing from your browser when asked. Android 10 or newer.
          Updating over an older build keeps your data when both were signed by this project's key.

          ## Check the download
          `SHA256SUMS.txt` lists each file's SHA-256. Every APK is signed with the certificate whose SHA-256 is:

          `""" + cert + """`
          """)
          PY
          flags=(); [ "$PRE" = "true" ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md "${flags[@]}"
          else
            gh release create "$TAG" --title "Ultimate $VER" --notes-file notes.md --target "$GITHUB_SHA" --latest "${flags[@]}"
          fi
          gh release upload "$TAG" dist-apk/* --clobber

name: Ultimate Companion APK
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code higher than every previously distributed Companion APK'
        required: true
        type: number
permissions:
  contents: write
concurrency:
  group: ultimate-companion
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent companion signing key
        env:
          KEYSTORE: ${{ secrets.COMPANION_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Permanent companion signing key is required'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/companion.jks"
      - name: Test and build
        env:
          COMPANION_VERSION_CODE: ${{ inputs.version_code }}
          ULTIMATE_KEYSTORE_FILE: ${{ runner.temp }}/companion.jks
          ULTIMATE_KEYSTORE_PASSWORD: ${{ secrets.COMPANION_KEYSTORE_PASSWORD }}
          ULTIMATE_KEY_ALIAS: companion
          ULTIMATE_KEY_PASSWORD: ${{ secrets.COMPANION_KEYSTORE_PASSWORD }}
        run: |
          test "$COMPANION_VERSION_CODE" -gt 0 && test "$COMPANION_VERSION_CODE" -le 2100000000
          gradle --no-daemon -PcompanionBuild=true :app:testUltimateplusDebugUnitTest :app:assembleUltimateplusRelease
      - name: Package APK and checksum
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/ultimateplus/release/*.apk dist-apk/Ultimate-Companion.apk
          cd dist-apk
          sha256sum Ultimate-Companion.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Companion
          path: dist-apk/*
          retention-days: 7
          if-no-files-found: error
      - name: Publish rolling preview download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ultimate-companion-preview >/dev/null 2>&1 || gh release create ultimate-companion-preview --prerelease --title 'Ultimate Companion preview' --notes 'Companion preview builds. Signed with the permanent companion key. APKs are release assets, never Git files.' --target "$GITHUB_SHA"
          gh release upload ultimate-companion-preview dist-apk/* --clobber
          gh release edit ultimate-companion-preview --notes "Built from $GITHUB_SHA. Install Ultimate-Companion.apk. Includes local camera preview (no audio), media previews, phone playback requests, transfer progress, live job status, and log collapse fix. Existing Claude APK signing compatibility is unverified. Full duplex live audio/video is not implemented."

name: Android checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, codex/ultimate-ssh]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build minified release
        run: gradle --no-daemon :app:testUltimateplusDebugUnitTest :app:lintUltimateplusRelease :app:assembleUltimateplusRelease :app:assembleUltimateRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-validation
          path: |
            app/build/reports/
            app/build/outputs/apk/ultimateplus/release/*.apk
          if-no-files-found: warn

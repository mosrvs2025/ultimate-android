name: Terminal device smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terminal-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" -Pkotlin.compiler.execution.strategy=in-process :app:connectedUltimateplusDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.ultimate.TerminalSmokeTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Terminal-smoke-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
